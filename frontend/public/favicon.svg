<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SolarConnect icon: gold sun above a blue solar panel, on a dark rounded square -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#020617"/>

  <!-- Sun with rays -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="5" x2="32" y2="9"/>
    <line x1="18" y1="11" x2="20.5" y2="14"/>
    <line x1="46" y1="11" x2="43.5" y2="14"/>
    <line x1="12" y1="24" x2="16" y2="24"/>
    <line x1="52" y1="24" x2="48" y2="24"/>
  </g>
  <circle cx="32" cy="24" r="10" fill="#fbbf24"/>

  <!-- Solar panel (tilted, 3 x 2 cells) -->
  <path d="M14 38 H50 L56 58 H8 Z" fill="url(#panel)" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#cbd5e1" stroke-width="1.6">
    <line x1="11" y1="48" x2="53" y2="48"/>
    <line x1="26" y1="38" x2="24" y2="58"/>
    <line x1="38" y1="38" x2="40" y2="58"/>
  </g>
</svg>
