<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#1d4ed8"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="aluminumFrame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sky & Warm Sun Background -->
  <rect width="800" height="500" rx="16" fill="url(#skyGrad)"/>
  <circle cx="160" cy="110" r="140" fill="url(#sunGlow)"/>
  <circle cx="160" cy="110" r="45" fill="#fef08a"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="640" cy="80" rx="70" ry="24"/>
    <ellipse cx="680" cy="70" rx="45" ry="28"/>
    <ellipse cx="600" cy="85" rx="35" ry="18"/>
  </g>

  <!-- Modern House Rooftop Structure -->
  <path d="M 40 450 L 760 450 L 680 230 L 120 230 Z" fill="url(#roofGrad)" filter="url(#panelShadow)"/>
  <path d="M 120 230 L 400 130 L 680 230 Z" fill="#334155"/>

  <!-- Solar Panel Array 1 (Left Group) -->
  <!-- 3D Slanted High Efficiency Solar Panels -->
  <!-- Row 1 Left -->
  <g filter="url(#panelShadow)">
    <!-- Base Mounting Stands -->
    <line x1="160" y1="380" x2="160" y2="395" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="330" y1="380" x2="330" y2="395" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="210" y1="260" x2="210" y2="275" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="350" y1="260" x2="350" y2="275" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Left Panel 1 -->
    <polygon points="150,380 340,380 360,260 190,260" fill="url(#aluminumFrame)" stroke="#475569" stroke-width="2"/>
    <polygon points="154,376 336,376 356,264 194,264" fill="url(#panelGlass)"/>
    
    <!-- Cell Grid for Panel 1 -->
    <line x1="172" y1="320" x2="348" y2="320" stroke="#93c5fd" stroke-width="1.5" opacity="0.75"/>
    <line x1="216" y1="376" x2="248" y2="264" stroke="#93c5fd" stroke-width="1.2" opacity="0.6"/>
    <line x1="274" y1="376" x2="302" y2="264" stroke="#93c5fd" stroke-width="1.2" opacity="0.6"/>
    <!-- Solar Flare / Glint on Glass -->
    <polygon points="180,360 210,360 240,270 220,270" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- Right Panel 2 (Center-Right Array) -->
  <g filter="url(#panelShadow)">
    <line x1="360" y1="380" x2="360" y2="395" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="530" y1="380" x2="530" y2="395" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <polygon points="355,380 545,380 565,260 395,260" fill="url(#aluminumFrame)" stroke="#475569" stroke-width="2"/>
    <polygon points="359,376 541,376 561,264 399,264" fill="url(#panelGlass)"/>
    
    <!-- Cell Grid for Panel 2 -->
    <line x1="377" y1="320" x2="553" y2="320" stroke="#93c5fd" stroke-width="1.5" opacity="0.75"/>
    <line x1="421" y1="376" x2="453" y2="264" stroke="#93c5fd" stroke-width="1.2" opacity="0.6"/>
    <line x1="479" y1="376" x2="507" y2="264" stroke="#93c5fd" stroke-width="1.2" opacity="0.6"/>
    <!-- Solar Flare / Glint -->
    <polygon points="385,360 415,360 445,270 425,270" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- Panel 3 (Far Right Array) -->
  <g filter="url(#panelShadow)">
    <polygon points="560,380 720,380 735,260 595,260" fill="url(#aluminumFrame)" stroke="#475569" stroke-width="2"/>
    <polygon points="564,376 716,376 731,264 599,264" fill="url(#panelGlass)"/>
    
    <line x1="580" y1="320" x2="724" y2="320" stroke="#93c5fd" stroke-width="1.5" opacity="0.75"/>
    <line x1="615" y1="376" x2="643" y2="264" stroke="#93c5fd" stroke-width="1.2" opacity="0.6"/>
    <line x1="668" y1="376" x2="689" y2="264" stroke="#93c5fd" stroke-width="1.2" opacity="0.6"/>
    <polygon points="585,360 610,360 635,270 615,270" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- Energy Generation Sparkles & Clean Energy Flow -->
  <g>
    <circle cx="280" cy="220" r="14" fill="#f59e0b" opacity="0.85"/>
    <path d="M 276 220 L 282 214 L 280 220 L 285 220 L 278 227 L 280 222 Z" fill="#ffffff"/>

    <circle cx="480" cy="210" r="12" fill="#10b981" opacity="0.85"/>
    <path d="M 477 210 L 482 205 L 480 210 L 484 210 L 478 216 L 480 212 Z" fill="#ffffff"/>
  </g>

  <!-- Live Output Badge Overlay on Image -->
  <g transform="translate(48, 390)">
    <rect width="210" height="48" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#10b981"/>
    <circle cx="24" cy="24" r="5" fill="#ffffff"/>
    <text x="44" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">LIVE GENERATION</text>
    <text x="44" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4.2 kW / hr · Generating</text>
  </g>

  <!-- Warranty Badge Overlay -->
  <g transform="translate(560, 390)">
    <rect width="190" height="48" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#f97316"/>
    <text x="44" y="20" fill="#fdba74" font-family="system-ui, sans-serif" font-size="10" font-weight="600">MONOCRYSTALLINE</text>
    <text x="44" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">20-Year Guarantee</text>
  </g>
</svg>
